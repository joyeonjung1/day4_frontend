<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 기반 장소 추천 에이전트</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>날씨 기반 장소 추천 에이전트</h1>
      <p class="sub">질문하면 Gemini가 <b>get_weather</b>(실시간 날씨·미세먼지)와 <b>find_spots</b>(장소 검색) 중 필요한 도구를 골라 호출해 추천합니다.</p>
    </header>

    <!-- AI 추천 채팅 -->
    <section class="chat" aria-label="AI 추천">
      <div id="chat-log" class="chat-log" aria-live="polite">
        <div class="msg model"><div class="bubble">안녕하세요! 지역과 상황을 알려 주세요. 날씨를 확인해서 어울리는 장소를 추천해 드릴게요.</div></div>
      </div>
      <div class="examples" id="examples"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-q" type="text" maxlength="300" placeholder="예) 내일 제주에서 비 오면 갈 만한 실내 장소 추천해줘">
        <button type="submit" id="chat-send">보내기</button>
      </form>
    </section>

    <!-- 추천 장소 + 날씨를 보는 2D 지도 -->
    <section class="mapbox">
      <div id="map" aria-label="지도"></div>
      <p class="maphint" id="maphint">지도를 클릭하면 그 지점의 날씨와 미세먼지를 보여 줍니다. 추천받은 장소는 번호 마커로 표시됩니다.</p>
    </section>

    <!-- 지역 검색 날씨 카드 -->
    <section class="wbox">
      <div class="wcard">
        <h2>실시간 날씨</h2>
        <form id="w-form" class="w-form" autocomplete="off">
          <div class="w-search">
            <input id="w-q" type="text" autocomplete="off" role="combobox" aria-controls="w-list"
                   placeholder="지역 입력 (첫 글자만 써도 추천: 서, 부, 평택, Seoul)">
            <ul id="w-list" class="w-list" role="listbox" hidden></ul>
          </div>
          <button type="submit" class="w-btn">검색</button>
        </form>
        <small id="w-hint" class="w-hint"></small>
        <div class="weather" id="weather" hidden></div>
      </div>
    </section>

    <!-- dummyjson products 데이터 구조 애니메이션 -->
    <section class="pbox" aria-label="dummyjson products 데이터 구조">
      <h2>dummyjson.com/products 데이터 구조</h2>
      <div class="pbar">
        <button type="button" id="p-play">다시 재생</button>
        <button type="button" id="p-all">모두 펼치기</button>
        <span class="pnote">객체·배열 이름을 누르면 접고 펼칩니다</span>
      </div>
      <div id="ptree" class="ptree"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="cities.js"></script>
  <script src="weather.js"></script>
  <script src="agent.js"></script>
  <script src="products-tree.js"></script>
</body>
</html>
